[package]
name = "unveil"
version = "0.1.0"
edition = "2021"
description = "Live Windows threat hunting: injected code, process hollowing, inline hooks, hidden processes and stealthy persistence, MITRE ATT&CK mapped"
authors = ["HaiND from the Post and Telecommunication Institute of Technology <haind@ptit.edu.vn>"]
license = "MIT"
repository = "https://github.com/Haind03/Unveil"
homepage = "https://github.com/Haind03/Unveil"
readme = "README.md"
keywords = ["threat-hunting", "dfir", "windows", "yara", "blue-team"]
categories = ["command-line-utilities"]
rust-version = "1.88"
build = "build.rs"
exclude = ["/target", "/.github"]

[[bin]]
name = "unveil"
path = "src/main.rs"

[features]
default = ["yara"]
# YARA scanning of process memory and files (pure Rust engine, yara-x).
yara = ["dep:yara-x"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }
yara-x = { version = "1", optional = true, default-features = false, features = ["pe-module", "hash-module", "math-module", "string-module", "time-module", "console-module"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_System_Environment",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
